name: Build Sarj Kilidi V5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sarj-kilidi-v5/**'
      - '.github/workflows/build-sarj-kilidi-v5.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: sarj-kilidi-v5
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: |
          mkdir -p built-apks
          cp sarj-kilidi-v5/app/build/outputs/apk/debug/app-debug.apk built-apks/SARJ_KILIDI_60SN_V5_GITHUB.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARJ_KILIDI_60SN_V5_GITHUB
          path: built-apks/SARJ_KILIDI_60SN_V5_GITHUB.apk
          if-no-files-found: error

