<style>
:root {
  --navy:#07111d;
  --navy2:#0b1a2b;
  --gold:#d9a441;
  --gold2:#f4cf82;
  --white:#f8fafc;
  --muted:#cbd5e1;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(217,164,65,.18), transparent 38%),
    linear-gradient(180deg,var(--navy),var(--navy2));
  color:var(--white);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.page {
  width:min(1100px,100%);
  margin:0 auto;
  padding:22px 14px 28px;
}
.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.brand {
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(22px,4vw,34px);
  letter-spacing:.05em;
  color:var(--gold2);
}
.date-pill {
  border:1px solid rgba(217,164,65,.75);
  border-radius:999px;
  padding:9px 14px;
  font-size:13px;
  color:var(--gold2);
  white-space:nowrap;
}
.hero {
  overflow:hidden;
  border:1px solid rgba(217,164,65,.32);
  border-radius:30px;
  background:rgba(255,255,255,.035);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}

  margin:0;

  display:block;
  font-size:clamp(38px,8vw,74px);

  display:block;

  letter-spacing:.12em;
  color:var(--gold2);

  text-align:center;
  margin-top:16px;
  color:var(--muted);
  font-size:14px;

  text-align:center;
  margin-top:10px;
  min-height:28px;
  color:var(--gold2);
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(18px,3vw,24px);
}
.footer {
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin-top:16px;
}

  position:fixed;
  top:-22px;
  width:9px;height:15px;
  opacity:.95;
  background:var(--gold);
  z-index:20;
  animation:fall linear forwards;
  pointer-events:none;
}

  to { transform:translate3d(var(--dx),110vh,0) rotate(820deg); }
}

  .page { padding:10px 8px 18px; }
  .top { margin:4px 4px 10px; }
  .date-pill { font-size:11px; padding:8px 10px; }
  .hero { border-radius:22px; }
  .photo { min-height:430px; height:58vh; }
  .count-wrap { padding:16px 8px 14px; }
  .count { gap:6px; }
  .unit { border-radius:15px; padding:14px 2px 11px; }
  .lab { font-size:9px; letter-spacing:.07em; }

<body>
<div class="page">
  <div class="top">
    <div class="brand">Fırat Değer</div>
    <div class="date-pill">14 Ağustos 2026 • Cuma • 12:00</div>
  </div>

  <section class="hero">
    <div class="photo">
      <div class="headline">
        <div class="kicker">BÜYÜK GÜNE DOĞRU</div>
        <h1><span>MÜDÜR</span> OLMASINA</h1>
        <div class="sub">Kararname için geri sayım başladı.</div>
      </div>
    </div>

    <div class="count-wrap">
      <div class="count" aria-live="polite">
        <div class="unit"><span class="num" id="days">00</span><span class="lab">GÜN</span></div>
        <div class="unit"><span class="num" id="hours">00</span><span class="lab">SAAT</span></div>
        <div class="unit"><span class="num" id="minutes">00</span><span class="lab">DAKİKA</span></div>
        <div class="unit"><span class="num" id="seconds">00</span><span class="lab">SANİYE</span></div>
      </div>
      <div class="target">Hedef: <b>14 Ağustos 2026 Cuma, 12:00</b> • Türkiye saati</div>
      <div class="message" id="message">Yolun açık olsun müdürüm.</div>
    </div>
  </section>

  <div class="footer">Geri sayım cihaz saatinden bağımsız olarak UTC+03:00 hedefiyle hesaplanır.</div>
</div>

<script>
const TARGET = new Date("2026-08-14T12:00:00+03:00").getTime();
let celebrated = false;

function pad(n) {
  return String(n).padStart(2,"0");
}

function confetti() {
  if (celebrated) return;
  celebrated = true;
  for (let i=0; i<80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.setProperty("--dx", ((Math.random()-.5)*260) + "px");
    c.style.animationDuration = (2.8 + Math.random()*3.2) + "s";
    c.style.animationDelay = (Math.random()*1.2) + "s";
    c.style.transform = "rotate(" + Math.random()*180 + "deg)";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 7000);
  }
}

function tick() {
  let diff = TARGET - Date.now();

  if (diff <= 0) {
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("minutes").textContent = "00";
    document.getElementById("seconds").textContent = "00";
    document.getElementById("message").textContent = "Hayırlı olsun Müdürüm! 🎉";
    document.title = "Hayırlı olsun Müdürüm!";
    confetti();
    return;
  }

  const d = Math.floor(diff / 86400000);
  diff %= 86400000;
  const h = Math.floor(diff / 3600000);
  diff %= 3600000;
  const m = Math.floor(diff / 60000);
  diff %= 60000;
  const s = Math.floor(diff / 1000);

  document.getElementById("days").textContent = pad(d);
  document.getElementById("hours").textContent = pad(h);
  document.getElementById("minutes").textContent = pad(m);
  document.getElementById("seconds").textContent = pad(s);
  document.title = `${d}g ${pad(h)}:${pad(m)}:${pad(s)} • Fırat Değer`;
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
